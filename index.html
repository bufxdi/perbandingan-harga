<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Perbandingan Harga</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f3f3f3">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 15px;
        }

        h1 {
            text-align: center;
            margin: 5px 0 15px;
            font-size: 24px;
        }

        .top-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        #addButton {
            background: #1976d2;
            color: white;
        }

        #clearAllButton {
            background: #d32f2f;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0,0,0,.15);
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 7px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #e0e0e0;
            font-weight: bold;
            user-select: none;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            background: #d0d0d0;
        }

        th.no-sort {
            cursor: default;
        }

        .sort-symbol {
            margin-left: 4px;
            font-size: 13px;
        }

        td.number-cell {
            width: 45px;
            font-weight: bold;
        }

        td.photo-cell {
            width: 120px;
        }

        .photo-button {
            background: #555;
            color: white;
            margin-bottom: 5px;
            width: 100%;
            max-width: 100px;
        }

        .photo-button:hover {
            background: #333;
        }

        .photo-input {
            display: none;
        }

        .photo-preview {
            display: block;
            width: 90px;
            height: 90px;
            object-fit: cover;
            margin: 4px auto;
            border-radius: 5px;
            border: 1px solid #aaa;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 14px;
            background: white;
        }

        .harga-input {
            text-align: right;
        }

        .berat-input {
            text-align: right;
        }

        .harga-satuan {
            font-weight: bold;
            white-space: nowrap;
        }

        .cheapest {
            background: #c8f7c5 !important;
        }

        .clear-row-button {
            background: #e53935;
            color: white;
            font-weight: bold;
            width: 100%;
            max-width: 90px;
        }

        .clear-row-button:hover {
            background: #c62828;
        }

        #status {
            min-height: 20px;
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 600px) {
            .container {
                padding: 8px;
            }

            h1 {
                font-size: 20px;
            }

            th,
            td {
                padding: 5px;
            }

            input[type="text"],
            input[type="number"],
            select {
                font-size: 13px;
                padding: 7px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Perbandingan Harga</h1>

    <div class="top-buttons">
        <button id="addButton">＋ Buat Kotak</button>
        <button id="clearAllButton">Clear All</button>
    </div>

    <div class="table-wrapper">
        <table id="priceTable">
            <thead>
                <tr>
                    <th class="no-sort">No.</th>
                    <th class="no-sort">Foto</th>

                    <th class="sortable" data-column="nama">
                        Nama / Merk
                        <span class="sort-symbol" id="sort-nama">↕</span>
                    </th>

                    <th class="sortable" data-column="harga">
                        Harga (Rp)
                        <span class="sort-symbol" id="sort-harga">↕</span>
                    </th>

                    <th class="sortable" data-column="berat">
                        Berat / Volume
                        <span class="sort-symbol" id="sort-berat">↕</span>
                    </th>

                    <th class="sortable" data-column="satuan">
                        Satuan
                        <span class="sort-symbol" id="sort-satuan">↕</span>
                    </th>

                    <th class="sortable" data-column="hargaSatuan">
                        Harga / Satuan
                        <span class="sort-symbol" id="sort-hargaSatuan">↕</span>
                    </th>

                    <th class="no-sort">Clear</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="status"></div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "perbandinganHargaData_v4";

let data = [];

let sortColumn = null;
let sortDirection = 0;
// 0 = original
// 1 = ascending
// 2 = descending

let photoDB = null;


/*
   IndexedDB hanya digunakan bila aplikasi berjalan melalui
   http / https.

   Bila index.html dibuka langsung dari file://,
   digunakan localStorage sebagai fallback.
*/
const useIndexedDB =
    location.protocol !== "file:" &&
    "indexedDB" in window;


/* =========================================================
   INITIAL DATA
========================================================= */

function createInitialData() {

    const result = [];

    for (let i = 0; i < 10; i++) {

        result.push({
            nama: "",
            harga: "",
            berat: "",
            satuan: "gram",

            /*
                Pada mode IndexedDB, foto tidak disimpan di sini.
                Pada mode file://, foto Base64 disimpan di sini.
            */
            foto: null,

            originalIndex: i
        });
    }

    return result;
}


/* =========================================================
   LOAD DATA
========================================================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {

            const parsed = JSON.parse(saved);

            if (Array.isArray(parsed)) {

                data = parsed.map((item, i) => {

                    return {
                        nama: item.nama || "",
                        harga: item.harga || "",
                        berat: item.berat || "",
                        satuan: item.satuan || "gram",
                        foto: item.foto || null,
                        originalIndex:
                            Number.isInteger(item.originalIndex)
                                ? item.originalIndex
                                : i
                    };

                });

                return;
            }
        }

    } catch (error) {

        console.error("Gagal membaca data:", error);
    }

    data = createInitialData();
}


/* =========================================================
   SAVE DATA
========================================================= */

function saveData() {

    try {

        /*
           Kalau IndexedDB aktif, foto tidak ikut dimasukkan
           ke localStorage.
        */

        const dataToSave = data.map(item => {

            return {
                nama: item.nama,
                harga: item.harga,
                berat: item.berat,
                satuan: item.satuan,

                /*
                   Pada mode file:// foto tetap Base64.
                   Pada mode IndexedDB biasanya null.
                */
                foto: useIndexedDB ? null : item.foto,

                originalIndex: item.originalIndex
            };

        });

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(dataToSave)
        );

    } catch (error) {

        console.error("Gagal menyimpan data:", error);

        setStatus(
            "Gagal menyimpan data. Penyimpanan mungkin penuh."
        );
    }
}


/* =========================================================
   INDEXED DB
========================================================= */

function openPhotoDB() {

    if (!useIndexedDB) {
        return Promise.resolve(null);
    }

    return new Promise((resolve, reject) => {

        const request =
            indexedDB.open("PerbandinganHargaDB", 1);

        request.onupgradeneeded = function(event) {

            const db = event.target.result;

            if (!db.objectStoreNames.contains("photos")) {

                db.createObjectStore(
                    "photos",
                    {
                        keyPath: "index"
                    }
                );
            }
        };

        request.onsuccess = function(event) {

            photoDB = event.target.result;

            resolve(photoDB);
        };

        request.onerror = function(event) {

            console.error(
                "IndexedDB gagal:",
                event.target.error
            );

            photoDB = null;

            reject(event.target.error);
        };

    });
}


/* =========================================================
   SAVE PHOTO TO INDEXED DB
========================================================= */

function savePhotoToDB(index, blob) {

    if (!photoDB) {
        return Promise.reject(
            new Error("Database foto belum siap.")
        );
    }

    return new Promise((resolve, reject) => {

        const transaction =
            photoDB.transaction(
                ["photos"],
                "readwrite"
            );

        const store =
            transaction.objectStore("photos");

        const request =
            store.put({
                index: index,
                blob: blob
            });

        request.onsuccess = function() {
            resolve();
        };

        request.onerror = function(event) {
            reject(event.target.error);
        };

    });
}


/* =========================================================
   GET PHOTO FROM INDEXED DB
========================================================= */

function getPhotoFromDB(index) {

    if (!photoDB) {
        return Promise.resolve(null);
    }

    return new Promise((resolve, reject) => {

        const transaction =
            photoDB.transaction(
                ["photos"],
                "readonly"
            );

        const store =
            transaction.objectStore("photos");

        const request =
            store.get(index);

        request.onsuccess = function() {

            if (request.result) {
                resolve(request.result.blob);
            } else {
                resolve(null);
            }
        };

        request.onerror = function(event) {
            reject(event.target.error);
        };

    });
}


/* =========================================================
   DELETE PHOTO
========================================================= */

function deletePhotoFromDB(index) {

    if (!photoDB) {
        return Promise.resolve();
    }

    return new Promise((resolve, reject) => {

        const transaction =
            photoDB.transaction(
                ["photos"],
                "readwrite"
            );

        const store =
            transaction.objectStore("photos");

        const request =
            store.delete(index);

        request.onsuccess = function() {
            resolve();
        };

        request.onerror = function(event) {
            reject(event.target.error);
        };

    });
}


/* =========================================================
   CLEAR ALL PHOTOS
========================================================= */

function clearAllPhotos() {

    if (!photoDB) {
        return Promise.resolve();
    }

    return new Promise((resolve, reject) => {

        const transaction =
            photoDB.transaction(
                ["photos"],
                "readwrite"
            );

        const store =
            transaction.objectStore("photos");

        const request =
            store.clear();

        request.onsuccess = function() {
            resolve();
        };

        request.onerror = function(event) {
            reject(event.target.error);
        };

    });
}


/* =========================================================
   NUMBER PARSING
========================================================= */

/*
   Contoh:

   50.000       -> 50000
   1.250.000    -> 1250000
   1.250,5      -> 1250.5
   1250,5       -> 1250.5
*/

function parseNumber(value) {

    if (value === null || value === undefined) {
        return NaN;
    }

    let str = String(value).trim();

    if (!str) {
        return NaN;
    }

    str = str.replace(/\s/g, "");

    /*
       Bila ada titik dan koma:
       titik dianggap pemisah ribuan,
       koma dianggap desimal.
    */

    if (
        str.includes(".") &&
        str.includes(",")
    ) {

        str = str.replace(/\./g, "");
        str = str.replace(",", ".");

    } else if (str.includes(",")) {

        str = str.replace(",", ".");

    } else if (
        str.includes(".")
    ) {

        /*
           Kalau titik digunakan sebagai pemisah ribuan.
           Contoh 50.000 atau 1.250.000
        */

        const parts = str.split(".");

        if (
            parts.length > 1 &&
            parts.slice(1).every(
                part => part.length === 3
            )
        ) {
            str = str.replace(/\./g, "");
        }
    }

    return Number(str);
}


/* =========================================================
   INDONESIAN NUMBER FORMAT
========================================================= */

function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(Number(value))
    ) {
        return "";
    }

    const number = Number(value);

    return number.toLocaleString(
        "id-ID",
        {
            maximumFractionDigits: 2
        }
    );
}


/* =========================================================
   PRICE INPUT FORMAT
========================================================= */

function formatPriceInput(input) {

    const raw = input.value;

    if (!raw) {
        return;
    }

    const number = parseNumber(raw);

    if (!Number.isNaN(number)) {

        input.value = formatNumber(number);

        const index =
            Number(input.dataset.index);

        data[index].harga =
            input.value;

        saveData();

        renderTable();
    }
}


/* =========================================================
   UNIT CONVERSION
========================================================= */

function getBaseMultiplier(unit) {

    switch (unit) {

        case "gram":
            return 1;

        case "kg":
            return 1000;

        case "ml":
            return 1;

        case "liter":
            return 1000;

        default:
            return 1;
    }
}


/* =========================================================
   PRICE PER BASE UNIT
========================================================= */

function calculateUnitPrice(item) {

    const harga =
        parseNumber(item.harga);

    const berat =
        parseNumber(item.berat);

    if (
        Number.isNaN(harga) ||
        Number.isNaN(berat) ||
        berat <= 0
    ) {
        return NaN;
    }

    const multiplier =
        getBaseMultiplier(item.satuan);

    const baseAmount =
        berat * multiplier;

    if (baseAmount <= 0) {
        return NaN;
    }

    return harga / baseAmount;
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;

    if (message) {

        setTimeout(() => {

            const status =
                document.getElementById("status");

            if (status.textContent === message) {
                status.textContent = "";
            }

        }, 2500);
    }
}


/* =========================================================
   PHOTO PROCESSING
========================================================= */

/*
   Bagian input file sengaja dibuat sama dengan kode lama:

       type=file
       accept=image/*
       capture=camera

   Jadi:

   Laptop Chrome
       -> pilih foto dari folder

   Android Chrome
       -> kamera
*/

function processPhoto(file, index) {

    if (!file.type.startsWith("image/")) {
        return;
    }

    setStatus("Memproses foto...");

    const reader =
        new FileReader();

    reader.onload = function(event) {

        const img =
            new Image();

        img.onload = function() {

            const maxSize = 700;

            let width =
                img.width;

            let height =
                img.height;

            if (
                width > maxSize ||
                height > maxSize
            ) {

                if (width > height) {

                    height =
                        Math.round(
                            height *
                            maxSize /
                            width
                        );

                    width = maxSize;

                } else {

                    width =
                        Math.round(
                            width *
                            maxSize /
                            height
                        );

                    height = maxSize;
                }
            }

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            canvas.toBlob(
                async function(blob) {

                    if (!blob) {

                        setStatus(
                            "Foto gagal diproses."
                        );

                        return;
                    }

                    try {

                        /*
                           MODE HTTPS / GITHUB PAGES

                           Blob langsung masuk IndexedDB.
                           Tidak diubah menjadi Base64.
                        */

                        if (useIndexedDB) {

                            await savePhotoToDB(
                                index,
                                blob
                            );

                            /*
                               Pastikan tidak ada Base64
                               yang tertinggal di metadata.
                            */

                            data[index].foto =
                                null;

                            saveData();

                        }

                        /*
                           MODE file://

                           Gunakan metode lama:
                           Blob -> Base64 -> localStorage
                        */

                        else {

                            const reader2 =
                                new FileReader();

                            reader2.onload =
                                function(event2) {

                                    data[index].foto =
                                        event2.result;

                                    saveData();

                                    renderTable();

                                    setStatus(
                                        "Foto tersimpan"
                                    );
                                };

                            reader2.readAsDataURL(
                                blob
                            );

                            return;
                        }

                        renderTable();

                        setStatus(
                            "Foto tersimpan"
                        );

                    } catch (error) {

                        console.error(
                            "Gagal menyimpan foto:",
                            error
                        );

                        setStatus(
                            "Foto gagal disimpan."
                        );
                    }

                },
                "image/jpeg",
                0.65
            );
        };

        img.onerror = function() {

            setStatus(
                "Foto tidak dapat dibaca."
            );
        };

        img.src =
            event.target.result;
    };

    reader.onerror = function() {

        setStatus(
            "Foto gagal dibaca."
        );
    };

    reader.readAsDataURL(file);
}


/* =========================================================
   RENDER PHOTO
========================================================= */

async function renderPhotoCell(
    cell,
    index
) {

    /*
       Bersihkan isi sebelumnya
    */

    cell.innerHTML = "";

    const button =
        document.createElement("button");

    button.className =
        "photo-button";

    button.textContent =
        "📷 " +
        (
            data[index].foto
                ? "Ganti Foto"
                : "Foto"
        );

    const fileInput =
        document.createElement("input");

    /*
       INI BAGIAN PENTING:
       sama seperti kode lama
    */

    fileInput.type = "file";

    fileInput.accept = "image/*";

    fileInput.capture = "camera";

    fileInput.className =
        "photo-input";

    fileInput.onchange =
        function(event) {

            if (
                event.target.files &&
                event.target.files[0]
            ) {

                processPhoto(
                    event.target.files[0],
                    index
                );
            }
        };

    button.onclick =
        function() {

            fileInput.click();
        };

    cell.appendChild(button);
    cell.appendChild(fileInput);


    /*
       MODE file://
       Ambil Base64 langsung
    */

    if (
        !useIndexedDB &&
        data[index].foto
    ) {

        const img =
            document.createElement("img");

        img.className =
            "photo-preview";

        img.src =
            data[index].foto;

        cell.appendChild(img);

        return;
    }


    /*
       MODE HTTPS
       Ambil Blob dari IndexedDB
    */

    if (useIndexedDB) {

        try {

            const blob =
                await getPhotoFromDB(index);

            if (blob) {

                const url =
                    URL.createObjectURL(
                        blob
                    );

                const img =
                    document.createElement("img");

                img.className =
                    "photo-preview";

                img.src = url;

                /*
                   Lepaskan object URL setelah
                   gambar selesai dimuat.
                */

                img.onload =
                    function() {

                        /*
                           Jangan langsung revoke terlalu
                           cepat karena gambar masih dipakai.
                        */

                        setTimeout(
                            () => URL.revokeObjectURL(url),
                            1000
                        );
                    };

                cell.appendChild(img);
            }

        } catch (error) {

            console.error(
                "Gagal membaca foto:",
                error
            );
        }
    }
}


/* =========================================================
   RENDER TABLE
========================================================= */

async function renderTable() {

    const tbody =
        document.getElementById(
            "tableBody"
        );

    tbody.innerHTML = "";


    /*
       Tentukan urutan data
    */

    let rows =
        data.map(
            (item, index) => ({
                item: item,
                index: index
            })
        );


    if (sortDirection !== 0) {

        rows.sort(
            function(a, b) {

                const itemA =
                    a.item;

                const itemB =
                    b.item;

                const valueA =
                    getSortValue(
                        itemA,
                        sortColumn
                    );

                const valueB =
                    getSortValue(
                        itemB,
                        sortColumn
                    );


                /*
                   Data kosong selalu di bawah
                */

                const emptyA =
                    valueA === null ||
                    valueA === "" ||
                    Number.isNaN(valueA);

                const emptyB =
                    valueB === null ||
                    valueB === "" ||
                    Number.isNaN(valueB);

                if (emptyA && emptyB) {
                    return 0;
                }

                if (emptyA) {
                    return 1;
                }

                if (emptyB) {
                    return -1;
                }


                let comparison = 0;

                if (
                    typeof valueA === "string" &&
                    typeof valueB === "string"
                ) {

                    comparison =
                        valueA.localeCompare(
                            valueB,
                            "id",
                            {
                                sensitivity: "base"
                            }
                        );

                } else {

                    if (valueA < valueB) {
                        comparison = -1;
                    } else if (valueA > valueB) {
                        comparison = 1;
                    }
                }


                return sortDirection === 1
                    ? comparison
                    : -comparison;
            }
        );
    }


    /*
       Cari nilai termurah untuk
       Harga / Satuan ascending.
    */

    let cheapestIndex = -1;

    if (
        sortColumn === "hargaSatuan" &&
        sortDirection === 1
    ) {

        let cheapestValue =
            Infinity;

        rows.forEach(row => {

            const value =
                calculateUnitPrice(
                    row.item
                );

            if (
                !Number.isNaN(value) &&
                value < cheapestValue
            ) {

                cheapestValue = value;

                cheapestIndex =
                    row.index;
            }
        });
    }


    /*
       Buat baris
    */

    for (const row of rows) {

        const index =
            row.index;

        const item =
            row.item;

        const tr =
            document.createElement("tr");


        /*
           NO.
           Nomor tidak berubah meskipun sorting.
        */

        const tdNo =
            document.createElement("td");

        tdNo.className =
            "number-cell";

        tdNo.textContent =
            item.originalIndex + 1;

        tr.appendChild(tdNo);


        /*
           FOTO
        */

        const tdFoto =
            document.createElement("td");

        tdFoto.className =
            "photo-cell";

        tr.appendChild(tdFoto);


        /*
           NAMA / MERK
        */

        const tdNama =
            document.createElement("td");

        const inputNama =
            document.createElement("input");

        inputNama.type = "text";

        inputNama.value =
            item.nama;

        inputNama.placeholder =
            "Nama / Merk";

        inputNama.addEventListener(
            "input",
            function() {

                data[index].nama =
                    this.value;

                saveData();
            }
        );

        tdNama.appendChild(
            inputNama
        );

        tr.appendChild(tdNama);


        /*
           HARGA
        */

        const tdHarga =
            document.createElement("td");

        const inputHarga =
            document.createElement("input");

        inputHarga.type = "text";

        inputHarga.inputMode =
            "decimal";

        inputHarga.className =
            "harga-input";

        inputHarga.value =
            item.harga;

        inputHarga.placeholder =
            "Rp";

        inputHarga.dataset.index =
            index;

        inputHarga.addEventListener(
            "input",
            function() {

                /*
                   Saat mengetik, simpan nilai
                   apa adanya dulu.
                */

                data[index].harga =
                    this.value;

                saveData();

                /*
                   Update harga satuan
                */

                updateUnitPriceDisplay();
            }
        );

        inputHarga.addEventListener(
            "blur",
            function() {

                const number =
                    parseNumber(
                        this.value
                    );

                if (
                    !Number.isNaN(number)
                ) {

                    this.value =
                        formatNumber(
                            number
                        );

                    data[index].harga =
                        this.value;

                    saveData();

                    renderTable();
                }
            }
        );

        tdHarga.appendChild(
            inputHarga
        );

        tr.appendChild(tdHarga);


        /*
           BERAT / VOLUME
        */

        const tdBerat =
            document.createElement("td");

        const inputBerat =
            document.createElement("input");

        inputBerat.type = "text";

        inputBerat.inputMode =
            "decimal";

        inputBerat.className =
            "berat-input";

        inputBerat.value =
            item.berat;

        inputBerat.placeholder =
            "Berat";

        inputBerat.addEventListener(
            "input",
            function() {

                data[index].berat =
                    this.value;

                saveData();

                updateUnitPriceDisplay();
            }
        );

        inputBerat.addEventListener(
            "blur",
            function() {

                const number =
                    parseNumber(
                        this.value
                    );

                if (
                    !Number.isNaN(number)
                ) {

                    this.value =
                        formatNumber(
                            number
                        );

                    data[index].berat =
                        this.value;

                    saveData();

                    renderTable();
                }
            }
        );

        tdBerat.appendChild(
            inputBerat
        );

        tr.appendChild(tdBerat);


        /*
           SATUAN
        */

        const tdSatuan =
            document.createElement("td");

        const selectSatuan =
            document.createElement("select");

        const units = [
            "gram",
            "kg",
            "ml",
            "liter"
        ];

        units.forEach(unit => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = unit;

            option.textContent = unit;

            if (
                item.satuan === unit
            ) {
                option.selected = true;
            }

            selectSatuan.appendChild(
                option
            );
        });

        selectSatuan.addEventListener(
            "change",
            function() {

                data[index].satuan =
                    this.value;

                saveData();

                renderTable();
            }
        );

        tdSatuan.appendChild(
            selectSatuan
        );

        tr.appendChild(tdSatuan);


        /*
           HARGA / SATUAN
        */

        const tdHargaSatuan =
            document.createElement("td");

        tdHargaSatuan.className =
            "harga-satuan";

        const unitPrice =
            calculateUnitPrice(
                item
            );

        if (
            !Number.isNaN(unitPrice)
        ) {

            tdHargaSatuan.textContent =
                "Rp " +
                formatNumber(
                    unitPrice
                );

        } else {

            tdHargaSatuan.textContent =
                "-";
        }


        if (
            index === cheapestIndex
        ) {

            tdHargaSatuan.classList.add(
                "cheapest"
            );

            tdNama.classList.add(
                "cheapest"
            );

            tdHarga.classList.add(
                "cheapest"
            );

            tdBerat.classList.add(
                "cheapest"
            );

            tdSatuan.classList.add(
                "cheapest"
            );
        }

        tr.appendChild(
            tdHargaSatuan
        );


        /*
           CLEAR PER BARIS
        */

        const tdClear =
            document.createElement("td");

        const clearButton =
            document.createElement("button");

        clearButton.className =
            "clear-row-button";

        clearButton.textContent =
            "Clear";

        clearButton.onclick =
            async function() {

                const confirmed =
                    confirm(
                        "Hapus seluruh isi produk nomor " +
                        (item.originalIndex + 1) +
                        "?"
                    );

                if (!confirmed) {
                    return;
                }

                data[index].nama = "";
                data[index].harga = "";
                data[index].berat = "";
                data[index].satuan = "gram";
                data[index].foto = null;

                if (useIndexedDB) {

                    try {

                        await deletePhotoFromDB(
                            index
                        );

                    } catch (error) {

                        console.error(
                            error
                        );
                    }
                }

                saveData();

                renderTable();

                setStatus(
                    "Data produk dihapus."
                );
            };

        tdClear.appendChild(
            clearButton
        );

        tr.appendChild(tdClear);


        tbody.appendChild(tr);


        /*
           Render foto setelah baris masuk DOM
        */

        renderPhotoCell(
            tdFoto,
            index
        );
    }


    updateSortSymbols();
}


/* =========================================================
   SORT VALUE
========================================================= */

function getSortValue(
    item,
    column
) {

    switch (column) {

        case "nama":

            return item.nama
                ? item.nama.toLowerCase()
                : null;


        case "harga":

            return parseNumber(
                item.harga
            );


        case "berat":

            return parseNumber(
                item.berat
            );


        case "satuan":

            return item.satuan
                ? item.satuan
                : null;


        case "hargaSatuan":

            return calculateUnitPrice(
                item
            );


        default:

            return null;
    }
}


/* =========================================================
   UPDATE SORT SYMBOL
========================================================= */

function updateSortSymbols() {

    const columns = [
        "nama",
        "harga",
        "berat",
        "satuan",
        "hargaSatuan"
    ];

    columns.forEach(column => {

        const element =
            document.getElementById(
                "sort-" + column
            );

        if (!element) {
            return;
        }

        if (
            sortColumn !== column ||
            sortDirection === 0
        ) {

            element.textContent =
                "↕";

        } else if (
            sortDirection === 1
        ) {

            element.textContent =
                "↑";

        } else {

            element.textContent =
                "↓";
        }
    });
}


/* =========================================================
   SORT
========================================================= */

document.querySelectorAll(
    "th.sortable"
).forEach(header => {

    header.addEventListener(
        "click",
        function() {

            const column =
                this.dataset.column;

            if (
                sortColumn !== column
            ) {

                sortColumn =
                    column;

                sortDirection = 1;

            } else {

                sortDirection++;

                if (
                    sortDirection > 2
                ) {

                    /*
                       Kembali ke urutan asli
                    */

                    sortDirection = 0;
                }
            }

            renderTable();
        }
    );
});


/* =========================================================
   ADD ROWS
========================================================= */

document.getElementById(
    "addButton"
).addEventListener(
    "click",
    function() {

        const newIndex =
            data.length;

        data.push({

            nama: "",
            harga: "",
            berat: "",
            satuan: "gram",
            foto: null,

            originalIndex:
                newIndex
        });

        saveData();

        renderTable();

        setStatus(
            "Kotak baru ditambahkan."
        );
    }
);


/* =========================================================
   CLEAR ALL
========================================================= */

document.getElementById(
    "clearAllButton"
).addEventListener(
    "click",
    async function() {

        const confirmed =
            confirm(
                "Yakin ingin menghapus SEMUA data dan foto?"
            );

        if (!confirmed) {
            return;
        }

        /*
           Hapus foto IndexedDB
        */

        if (useIndexedDB) {

            try {

                await clearAllPhotos();

            } catch (error) {

                console.error(
                    "Gagal menghapus foto:",
                    error
                );
            }
        }


        /*
           Buat kembali 10 baris awal
        */

        data =
            createInitialData();


        /*
           Reset sorting
        */

        sortColumn = null;
        sortDirection = 0;


        /*
           Hapus localStorage
        */

        try {

            localStorage.removeItem(
                STORAGE_KEY
            );

        } catch (error) {

            console.error(error);
        }


        saveData();

        renderTable();

        setStatus(
            "Semua data telah dihapus."
        );
    }
);

   UPDATE UNIT PRICE WITHOUT FULL RENDER
========================================================= */

       Tidak perlu melakukan apa-apa di sini.
       Perhitungan akan diperbarui ketika blur/render.
    */

}


/* =========================================================
   START APPLICATION
========================================================= */

async function startApp() {

    loadData();

    /*
       Buka IndexedDB bila menggunakan
       HTTP/HTTPS.
    */

    if (useIndexedDB) {

        try {

            await openPhotoDB();

        } catch (error) {

            /*
               Kalau IndexedDB gagal meskipun HTTPS,
               aplikasi tetap berjalan.

               Namun foto tidak akan disimpan ke
               IndexedDB sampai database tersedia.
            */

            console.error(
                "IndexedDB tidak tersedia:",
                error
            );
        }
    }

    renderTable();


    /*
       Informasi mode penyimpanan hanya
       untuk debugging.
    */

    console.log(
        useIndexedDB
            ? "Mode foto: IndexedDB"
            : "Mode foto: localStorage fallback"
    );
}


startApp();


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )
                .then(function() {

                    console.log(
                        "Service Worker aktif"
                    );
                })
                .catch(function(error) {

                    console.error(
                        "Service Worker gagal:",
                        error
                    );
                });

        }
    );
}
