
<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#f4f4f4">
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Perbandingan Harga</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 15px;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }

    h2 {
        text-align: center;
        margin: 5px 0 15px;
    }

    .table-container {
        width: 100%;
        overflow-x: auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    table {
        width: 100%;
        min-width: 400px;
        border-collapse: collapse;
    }

    th,
    td {
        border: 1px solid #ccc;
        padding: 6px;
        text-align: center;
    }

    th {
        background: #e9e9e9;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
    }

    th:hover {
        background: #dcdcdc;
    }

    /* Header No. dan Foto tidak bisa diklik */
    th.no-sort {
        cursor: default;
    }

    th.no-sort:hover {
        background: #e9e9e9;
    }

    th .arrow {
        margin-left: 4px;
        font-size: 13px;
    }

    td:first-child {
        width: 45px;
    }

    .foto-cell {
        width: 100px;
    }

    .foto-preview {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #ccc;
        display: block;
        margin: 0 auto 5px;
    }

    .foto-button {
        font-size: 12px;
        padding: 5px 8px;
        cursor: pointer;
        border: 1px solid #aaa;
        border-radius: 5px;
        background: #f5f5f5;
    }

    .foto-button:hover {
        background: #e5e5e5;
    }

    input[type="text"] {
        width: 100%;
        padding: 7px;
        border: 1px solid #bbb;
        border-radius: 4px;
        font-size: 14px;
    }

    input[type="text"] {
        text-align: left;
    }

    .harga-satuan {
        font-weight: bold;
        white-space: nowrap;
    }

    .termurah {
        background: #c8f7c5 !important;
    }

    .button-container {
        margin-top: 15px;
        text-align: center;
    }

    .clear-all {
        padding: 10px 20px;
        font-size: 15px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #d9534f;
        color: white;
    }

    .clear-all:hover {
        background: #c9302c;
    }

    .hint {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin-top: 8px;
    }
</style>
</head>

<body>

<h2>Perbandingan Harga</h2>

<div class="table-container">

<table>

    <thead>

        <tr>

            <!-- NO TIDAK BISA DISORTIR -->
            <th class="no-sort">
                No.
            </th>

            <!-- FOTO TIDAK BISA DISORTIR -->
            <th class="no-sort">
                Foto
            </th>

            <th onclick="sortTable('nama')">
                Nama / Merk
                <span id="arrow-nama" class="arrow">↕</span>
            </th>

            <th onclick="sortTable('harga')">
                Harga (Rp)
                <span id="arrow-harga" class="arrow">↕</span>
            </th>

            <th onclick="sortTable('berat')">
                Kuantitas
                <span id="arrow-berat" class="arrow">↕</span>
            </th>

            <th onclick="sortTable('hargaSatuan')">
                Harga / Kuantitas
                <span id="arrow-hargaSatuan" class="arrow">↕</span>
            </th>

        </tr>

    </thead>

    <tbody id="tableBody"></tbody>

</table>

</div>


<div class="button-container">

    <button class="clear-all" onclick="clearAll()">
        Clear All
    </button>

</div>


<div class="hint">
    Harga dan kuantitas otomatis menggunakan format ribuan Indonesia.
</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "perbandinganHargaData_v2";


/* =========================================================
   VARIABLE
========================================================= */

let data = [];

let currentSortColumn = null;

let currentSortDirection = 0;

/*
    0 = urutan asli
    1 = ascending
    2 = descending
*/


/* =========================================================
   DATA AWAL
========================================================= */

function createEmptyData() {

    let arr = [];

    for (let i = 0; i < 10; i++) {

        arr.push({

            nama: "",

            harga: "",

            berat: "",

            foto: "",

            originalIndex: i

        });

    }

    return arr;

}


/* =========================================================
   LOAD DATA
========================================================= */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (saved) {

        try {

            data = JSON.parse(saved);

            if (
                !Array.isArray(data) ||
                data.length !== 10
            ) {

                data = createEmptyData();

            }

        } catch (e) {

            data = createEmptyData();

        }

    } else {

        data = createEmptyData();

    }


    /*
       Pastikan setiap data memiliki
       originalIndex.
    */

    data.forEach(
        function(item, index) {

            if (
                item.originalIndex === undefined
            ) {

                item.originalIndex = index;

            }

        }
    );


    renderTable();

}


/* =========================================================
   SAVE DATA
========================================================= */

function saveData() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(data)

        );

    } catch (e) {

        alert(
            "Data tidak dapat disimpan. " +
            "Penyimpanan browser mungkin sudah penuh."
        );

    }

}


/* =========================================================
   PARSE ANGKA INDONESIA
========================================================= */

function parseAngka(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return NaN;

    }


    let str =
        String(value).trim();


    if (str === "") {

        return NaN;

    }


    /*
       Hilangkan spasi.
    */

    str =
        str.replace(/\s/g, "");


    /*
       Hilangkan titik ribuan.
    */

    str =
        str.replace(/\./g, "");


    /*
       Koma Indonesia
       menjadi titik JavaScript.
    */

    str =
        str.replace(/,/g, ".");


    return parseFloat(str);

}


/* =========================================================
   FORMAT ANGKA INDONESIA
========================================================= */

function formatAngkaIndonesia(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    let str =
        String(value).trim();


    if (str === "") {

        return "";

    }


    /*
       Pisahkan bagian desimal.
    */

    let parts =
        str.split(",");


    /*
       Bagian integer.
    */

    let integerPart =
        parts[0];


    /*
       Hanya angka.
    */

    integerPart =
        integerPart.replace(/\D/g, "");


    if (integerPart === "") {

        integerPart = "0";

    }


    /*
       Format ribuan Indonesia.
    */

    integerPart =
        Number(integerPart)
        .toLocaleString("id-ID");


    /*
       Jika ada desimal.
    */

    if (parts.length > 1) {

        let decimalPart =
            parts
            .slice(1)
            .join("")
            .replace(/\D/g, "");


        return (
            integerPart +
            "," +
            decimalPart
        );

    }


    return integerPart;

}


/* =========================================================
   FORMAT INPUT ANGKA SAAT MENGETIK
========================================================= */

function formatInputAngka(
    input,
    index,
    field
) {

    let value =
        input.value;


    /*
       Posisi cursor sebelum diformat.
    */

    let cursorPosition =
        input.selectionStart;


    /*
       Hitung jumlah digit sebelum cursor.
    */

    let beforeCursor =
        value
        .substring(
            0,
            cursorPosition
        )
        .replace(/\D/g, "")
        .length;


    /*
       Hanya izinkan angka dan koma.
    */

    value =
        value.replace(
            /[^\d,]/g,
            ""
        );


    /*
       Hanya boleh satu koma.
    */

    const firstComma =
        value.indexOf(",");


    if (firstComma !== -1) {

        value =
            value.substring(
                0,
                firstComma + 1
            ) +

            value
            .substring(
                firstComma + 1
            )
            .replace(/,/g, "");

    }


    /*
       Pisahkan integer dan desimal.
    */

    let parts =
        value.split(",");


    let integerPart =
        parts[0];


    let decimalPart =
        parts.length > 1
            ? parts[1]
            : null;


    /*
       Hilangkan leading zero
       yang berlebihan.
    */

    if (
        integerPart.length > 1
    ) {

        integerPart =
            integerPart.replace(
                /^0+(?=\d)/,
                ""
            );

    }


    /*
       Format ribuan.
    */

    if (
        integerPart !== ""
    ) {

        integerPart =
            Number(integerPart)
            .toLocaleString("id-ID");

    }


    let formatted =
        integerPart;


    /*
       Kembalikan desimal.
    */

    if (
        decimalPart !== null
    ) {

        formatted +=
            "," +
            decimalPart;

    }


    /*
       Tampilkan hasil format.
    */

    input.value =
        formatted;


    /*
       Simpan dalam format angka normal.

       50.000
          ↓
       50000
    */

    data[index][field] =
        convertToStorageValue(
            formatted
        );


    saveData();


    /*
       Update harga per kuantitas.
    */

    updateHargaSatuan(index);


    /*
       Kembalikan posisi cursor.
    */

    let newPosition = 0;

    let digitCount = 0;


    for (
        let i = 0;
        i < formatted.length;
        i++
    ) {

        if (
            /\d/.test(formatted[i])
        ) {

            digitCount++;


            if (
                digitCount >=
                beforeCursor
            ) {

                newPosition =
                    i + 1;

                break;

            }

        }

    }


    if (
        beforeCursor === 0
    ) {

        newPosition = 0;

    }


    if (
        newPosition >
        formatted.length
    ) {

        newPosition =
            formatted.length;

    }


    try {

        input.setSelectionRange(
            newPosition,
            newPosition
        );

    } catch (e) {}

}


/* =========================================================
   CONVERT TO STORAGE
========================================================= */

function convertToStorageValue(
    value
) {

    if (!value) {

        return "";

    }


    let str =
        String(value);


    /*
       Hilangkan titik ribuan.
    */

    str =
        str.replace(/\./g, "");


    /*
       Koma menjadi titik desimal.
    */

    str =
        str.replace(",", ".");


    return str;

}


/* =========================================================
   HITUNG HARGA / KUANTITAS
========================================================= */

function hitungHargaSatuan(item) {

    const harga =
        parseAngka(item.harga);


    const kuantitas =
        parseAngka(item.berat);


    if (
        isNaN(harga) ||
        isNaN(kuantitas) ||
        kuantitas <= 0
    ) {

        return null;

    }


    /*
       Karena kolom Satuan sudah dihapus,
       kuantitas langsung digunakan
       sebagai pembagi harga.
    */

    return (
        harga /
        kuantitas
    );

}


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function formatRupiah(value) {

    if (
        value === null ||
        isNaN(value)
    ) {

        return "-";

    }


    return (
        "Rp " +
        Math.round(value)
        .toLocaleString("id-ID")
    );

}


/* =========================================================
   UPDATE HARGA / KUANTITAS
========================================================= */

function updateHargaSatuan(index) {

    const row =
        document.querySelector(
            `tr[data-index="${index}"]`
        );


    if (!row) {

        return;

    }


    const cell =
        row.querySelector(
            ".harga-satuan"
        );


    if (!cell) {

        return;

    }


    const result =
        hitungHargaSatuan(
            data[index]
        );


    cell.textContent =
        result === null
            ? "-"
            : formatRupiah(result);

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    const tbody =
        document.getElementById(
            "tableBody"
        );


    tbody.innerHTML = "";


    /*
       Buat copy data.

       Data asli tetap berada
       dalam urutan originalIndex.
    */

    let displayData =
        [...data];


    /*
       Jika sedang sorting,
       urutkan copy tersebut.
    */

    if (
        currentSortColumn !== null &&
        currentSortDirection !== 0
    ) {

        displayData.sort(
            compareItems
        );

    }


    displayData.forEach(
        function(item, displayIndex) {

            const index =
                item.originalIndex;


            const tr =
                document.createElement(
                    "tr"
                );


            tr.setAttribute(
                "data-index",
                index
            );


            /* =============================================
               NO
            ============================================= */

            const tdNo =
                document.createElement(
                    "td"
                );


            /*
               Nomor mengikuti POSISI BARIS,
               bukan originalIndex.

               Jadi setelah sorting:
               baris pertama = 1
               baris kedua   = 2
               baris ketiga  = 3
               dst.
            */

            tdNo.textContent =
                displayIndex + 1;


            tr.appendChild(tdNo);


            /* =============================================
               FOTO
            ============================================= */

            const tdFoto =
                document.createElement(
                    "td"
                );


            tdFoto.className =
                "foto-cell";


            /*
               Jika sudah ada foto,
               tampilkan foto.
            */

            if (item.foto) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    item.foto;


                img.className =
                    "foto-preview";


                tdFoto.appendChild(img);

            }


            /*
               Tombol foto.
            */

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "foto-button";


            button.textContent =
                item.foto
                    ? "Ganti Foto"
                    : "📷 Foto";


            /*
               Input file.
            */

            const fileInput =
                document.createElement(
                    "input"
                );


            fileInput.type =
                "file";


            fileInput.accept =
                "image/*";


            fileInput.capture =
                "camera";


            fileInput.style.display =
                "none";


            fileInput.addEventListener(
                "change",
                function() {

                    if (
                        this.files &&
                        this.files[0]
                    ) {

                        kompresFoto(
                            this.files[0],
                            index
                        );

                    }

                }
            );


            button.onclick =
                function() {

                    fileInput.click();

                };


            tdFoto.appendChild(
                button
            );


            tdFoto.appendChild(
                fileInput
            );


            tr.appendChild(tdFoto);


            /* =============================================
               NAMA / MERK
            ============================================= */

            const tdNama =
                document.createElement(
                    "td"
                );


            const inputNama =
                document.createElement(
                    "input"
                );


            inputNama.type =
                "text";


            inputNama.value =
                item.nama || "";


            inputNama.placeholder =
                "Nama / Merk";


            inputNama.addEventListener(
                "input",
                function() {

                    data[index].nama =
                        this.value;


                    saveData();

                }
            );


            tdNama.appendChild(
                inputNama
            );


            tr.appendChild(tdNama);


            /* =============================================
               HARGA
            ============================================= */

            const tdHarga =
                document.createElement(
                    "td"
                );


            const inputHarga =
                document.createElement(
                    "input"
                );


            inputHarga.type =
                "text";


            inputHarga.inputMode =
                "decimal";


            inputHarga.placeholder =
                "0";


            /*
               Tampilkan angka lama
               dengan format Indonesia.
            */

            if (
                item.harga !== ""
            ) {

                const numericValue =
                    parseAngka(
                        item.harga
                    );


                if (
                    !isNaN(numericValue)
                ) {

                    inputHarga.value =
                        formatAngkaIndonesia(
                            numericValue
                        );

                }

            }


            inputHarga.addEventListener(
                "input",
                function() {

                    formatInputAngka(
                        this,
                        index,
                        "harga"
                    );

                }
            );


            tdHarga.appendChild(
                inputHarga
            );


            tr.appendChild(tdHarga);


            /* =============================================
               KUANTITAS
            ============================================= */

            const tdBerat =
                document.createElement(
                    "td"
                );


            const inputBerat =
                document.createElement(
                    "input"
                );


            inputBerat.type =
                "text";


            inputBerat.inputMode =
                "decimal";


            inputBerat.placeholder =
                "0";


            /*
               Tampilkan angka lama
               dengan format Indonesia.
            */

            if (
                item.berat !== ""
            ) {

                const numericValue =
                    parseAngka(
                        item.berat
                    );


                if (
                    !isNaN(numericValue)
                ) {

                    inputBerat.value =
                        formatAngkaIndonesia(
                            numericValue
                        );

                }

            }


            inputBerat.addEventListener(
                "input",
                function() {

                    formatInputAngka(
                        this,
                        index,
                        "berat"
                    );

                }
            );


            tdBerat.appendChild(
                inputBerat
            );


            tr.appendChild(tdBerat);


            /* =============================================
               HARGA / KUANTITAS
            ============================================= */

            const tdHargaSatuan =
                document.createElement(
                    "td"
                );


            tdHargaSatuan.className =
                "harga-satuan";


            const result =
                hitungHargaSatuan(
                    item
                );


            tdHargaSatuan.textContent =
                result === null
                    ? "-"
                    : formatRupiah(
                        result
                    );


            tr.appendChild(
                tdHargaSatuan
            );


            tbody.appendChild(tr);

        }
    );


    /*
       Highlight harga per kuantitas termurah
       ketika sorting ascending.
    */

    if (
        currentSortColumn ===
        "hargaSatuan" &&
        currentSortDirection === 1
    ) {

        highlightCheapest();

    }


    updateArrows();

}


/* =========================================================
   SORTING
========================================================= */

function compareItems(a, b) {

    /*
       Data kosong/incomplete
       selalu berada di bawah.
    */

    const aIncomplete =
        isIncomplete(a);


    const bIncomplete =
        isIncomplete(b);


    if (
        aIncomplete &&
        !bIncomplete
    ) {

        return 1;

    }


    if (
        !aIncomplete &&
        bIncomplete
    ) {

        return -1;

    }


    let valueA;

    let valueB;


    /* =============================================
       NAMA
    ============================================= */

    if (
        currentSortColumn === "nama"
    ) {

        valueA =
            (a.nama || "")
            .toLowerCase();


        valueB =
            (b.nama || "")
            .toLowerCase();

    }


    /* =============================================
       HARGA
    ============================================= */

    else if (
        currentSortColumn === "harga"
    ) {

        valueA =
            parseAngka(
                a.harga
            );


        valueB =
            parseAngka(
                b.harga
            );

    }


    /* =============================================
       KUANTITAS
    ============================================= */

    else if (
        currentSortColumn === "berat"
    ) {

        valueA =
            parseAngka(
                a.berat
            );


        valueB =
            parseAngka(
                b.berat
            );

    }


    /* =============================================
       HARGA / KUANTITAS
    ============================================= */

    else if (
        currentSortColumn ===
        "hargaSatuan"
    ) {

        valueA =
            hitungHargaSatuan(a);


        valueB =
            hitungHargaSatuan(b);

    }


    /*
       Nilai angka yang tidak valid
       ditempatkan paling bawah.
    */

    if (
        typeof valueA === "number" &&
        isNaN(valueA)
    ) {

        valueA = Infinity;

    }


    if (
        typeof valueB === "number" &&
        isNaN(valueB)
    ) {

        valueB = Infinity;

    }


    let result = 0;


    if (
        valueA < valueB
    ) {

        result = -1;

    }


    else if (
        valueA > valueB
    ) {

        result = 1;

    }


    else {

        /*
           Jika sama,
           pertahankan urutan asli.
        */

        result =
            a.originalIndex -
            b.originalIndex;

    }


    /*
       Descending.
    */

    if (
        currentSortDirection === 2
    ) {

        result *= -1;

    }


    return result;

}


/* =========================================================
   CEK DATA INCOMPLETE
========================================================= */

function isIncomplete(item) {

    const harga =
        parseAngka(
            item.harga
        );


    const berat =
        parseAngka(
            item.berat
        );


    return (

        !item.nama &&

        isNaN(harga) &&

        isNaN(berat)

    );

}


/* =========================================================
   SORT TABLE
========================================================= */

function sortTable(column) {

    /*
       Jika klik kolom berbeda,
       mulai dari ascending.
    */

    if (
        currentSortColumn !== column
    ) {

        currentSortColumn =
            column;


        currentSortDirection =
            1;

    }


    else {

        /*
           Siklus:

           Ascending
              ↓
           Descending
              ↓
           Original
              ↓
           Ascending
        */

        currentSortDirection++;


        if (
            currentSortDirection > 2
        ) {

            currentSortDirection = 0;

        }

    }


    renderTable();

}


/* =========================================================
   UPDATE ARROW
========================================================= */

function updateArrows() {

    /*
       Hanya kolom-kolom ini
       yang bisa disortir.

       No. dan Foto tidak dimasukkan.
    */

    const columns = [

        "nama",

        "harga",

        "berat",

        "hargaSatuan"

    ];


    columns.forEach(
        function(column) {

            const arrow =
                document.getElementById(
                    "arrow-" +
                    column
                );


            if (!arrow) {

                return;

            }


            /*
               Kolom tidak sedang disortir.
            */

            if (

                column !==
                currentSortColumn ||

                currentSortDirection === 0

            ) {

                arrow.textContent =
                    "↕";

            }


            /*
               Ascending.
            */

            else if (
                currentSortDirection === 1
            ) {

                arrow.textContent =
                    "↑";

            }


            /*
               Descending.
            */

            else {

                arrow.textContent =
                    "↓";

            }

        }
    );

}


/* =========================================================
   HIGHLIGHT TERMURAH
========================================================= */

function highlightCheapest() {

    let cheapest =
        Infinity;


    /*
       Cari harga per kuantitas
       paling murah.
    */

    data.forEach(
        function(item) {

            const value =
                hitungHargaSatuan(
                    item
                );


            if (
                value !== null &&
                value < cheapest
            ) {

                cheapest =
                    value;

            }

        }
    );


    if (
        cheapest === Infinity
    ) {

        return;

    }


    /*
       Beri warna hijau
       pada yang termurah.
    */

    document
        .querySelectorAll(
            "tr[data-index]"
        )
        .forEach(
            function(row) {

                const index =
                    Number(
                        row.getAttribute(
                            "data-index"
                        )
                    );


                const value =
                    hitungHargaSatuan(
                        data[index]
                    );


                if (
                    value !== null &&
                    value === cheapest
                ) {

                    row.classList.add(
                        "termurah"
                    );

                }

            }
        );

}


/* =========================================================
   KOMPRES FOTO
========================================================= */

function kompresFoto(
    file,
    index
) {

    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const img =
                new Image();


            img.onload =
                function() {

                    const maxSize =
                        800;


                    let width =
                        img.width;


                    let height =
                        img.height;


                    /*
                       Resize jika terlalu besar.
                    */

                    if (

                        width > maxSize ||
                        height > maxSize

                    ) {

                        if (
                            width > height
                        ) {

                            height =
                                height *
                                (
                                    maxSize /
                                    width
                                );


                            width =
                                maxSize;

                        }

                        else {

                            width =
                                width *
                                (
                                    maxSize /
                                    height
                                );


                            height =
                                maxSize;

                        }

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        Math.round(
                            width
                        );


                    canvas.height =
                        Math.round(
                            height
                        );


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(

                        img,

                        0,

                        0,

                        canvas.width,

                        canvas.height

                    );


                    /*
                       Kompres menjadi JPEG
                       kualitas 70%.
                    */

                    canvas.toBlob(

                        function(blob) {

                            const reader2 =
                                new FileReader();


                            reader2.onload =
                                function() {

                                    data[index].foto =
                                        reader2.result;


                                    saveData();


                                    renderTable();

                                };


                            reader2.readAsDataURL(
                                blob
                            );

                        },

                        "image/jpeg",

                        0.70

                    );

                };


            img.src =
                event.target.result;

        };


    reader.readAsDataURL(file);

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAll() {

    const yakin =
        confirm(
            "Hapus semua data dan semua foto?"
        );


    if (!yakin) {

        return;

    }


    data =
        createEmptyData();


    currentSortColumn =
        null;


    currentSortDirection =
        0;


    localStorage.removeItem(
        STORAGE_KEY
    );


    renderTable();

}
